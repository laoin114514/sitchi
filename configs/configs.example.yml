server:
  port: your_port
  host: your_host
  allow_origins:
    - your_allow_origins
    
db:
  host: your_db_host
  port: your_db_port
  user: your_db_user
  password: your_db_password
  dbname: your_db_name
  sslmode: your_db_sslmode

auth:
  jwt_secret: "your_jwt_secret"
  access_token_ttl_minutes: 0
  refresh_token_ttl_minutes: 0
  issuer: "your_issuer"

dev: your_dev_mode
